# Perfil de Pruebas Automatizadas (Entorno In-Memory H2)
# Permite la ejecución autónoma y rápida de la suite de pruebas unitarias y de integración

spring.datasource.url=jdbc:h2:mem:db_limatambo_test;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Deshabilitar banner y logs ruidosos durante pruebas
spring.main.banner-mode=off
logging.level.org.springframework=WARN
logging.level.com.clinica.limatambo=INFO
