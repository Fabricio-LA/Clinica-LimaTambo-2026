# Perfil Local Portable con Persistencia en Archivo Local
# Guarda todos los datos en ./data/limatambodb para que usuarios, citas y médicos persistan entre reinicios
spring.datasource.url=jdbc:h2:file:./data/limatambodb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola web H2 para visualizar tablas y datos
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
