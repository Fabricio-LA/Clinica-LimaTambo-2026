<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña | Clínica Limatambo</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/estilos-clinica.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="logo-login">
            <i class="bi bi-key-fill me-2" style="color: var(--matcha-main);"></i>
            NUEVA CLAVE
        </div>
        
        <div th:if="${error}" class="alert alert-danger py-2 small text-center" th:text="${error}"></div>
        
        <form th:if="${token != null}" th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            
            <p class="text-center text-muted small mb-4">Ingresa tu nueva contraseña a continuación.</p>

            <div class="mb-4">
                <label class="form-label small fw-bold">Nueva Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" id="passwordInput" class="form-control bg-light border-0" placeholder="Min. 8 caracteres" pattern="^(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}$" title="Debe tener al menos 8 caracteres, incluir mayúscula, minúscula, número y carácter especial" required>
                    <button class="btn btn-light bg-light border-0" type="button" id="togglePasswordBtn" style="color: var(--matcha-main);">
                        <i class="bi bi-eye-slash" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-reservar w-100 mb-3">Guardar Contraseña</button>
        </form>
        
        <div th:if="${token == null}" class="text-center mt-3">
            <a th:href="@{/forgot-password}" class="btn btn-outline-success btn-sm">Solicitar nuevo enlace</a>
        </div>

        <div class="text-center mt-3">
            <a th:href="@{/login}" class="text-decoration-none small text-muted">
                Volver al login
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('passwordInput');
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            const togglePasswordIcon = document.getElementById('togglePasswordIcon');

            if(togglePasswordBtn) {
                togglePasswordBtn.addEventListener('click', function () {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    
                    if (type === 'password') {
                        togglePasswordIcon.classList.remove('bi-eye');
                        togglePasswordIcon.classList.add('bi-eye-slash');
                    } else {
                        togglePasswordIcon.classList.remove('bi-eye-slash');
                        togglePasswordIcon.classList.add('bi-eye');
                    }
                });
            }
        });
    </script>
</body>
</html>
