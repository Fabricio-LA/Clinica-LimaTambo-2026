<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | Clínica Limatambo</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/estilos-clinica.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="logo-login">
            <i class="bi bi-shield-lock-fill me-2" style="color: var(--matcha-main);"></i>
            RECUPERACIÓN
        </div>
        
        <p class="text-center text-muted small mb-4">Ingresa tu correo electrónico registrado y te enviaremos un enlace para restablecer tu contraseña.</p>

        <div th:if="${error}" class="alert alert-danger py-2 small text-center" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-success py-2 small text-center" th:text="${mensaje}"></div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="mb-4">
                <label class="form-label small fw-bold">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control bg-light border-0" placeholder="ejemplo@correo.com" required>
                </div>
            </div>

            <button type="submit" class="btn btn-reservar w-100 mb-3">Enviar Enlace</button>
            
            <div class="text-center">
                <a th:href="@{/login}" class="text-decoration-none small text-muted">
                    <i class="bi bi-arrow-left me-1"></i> Volver al login
                </a>
            </div>
        </form>
    </div>
</body>
</html>
