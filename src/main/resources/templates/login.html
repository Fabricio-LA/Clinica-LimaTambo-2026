<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Clínica Limatambo</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/estilos-clinica.css}">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body class="login-body">

    <div class="login-card">
        <div class="logo-login text-center" style="height: 90px; display: flex; justify-content: center; align-items: center; margin-bottom: 0;">
            <img th:src="@{/images/LOGO_LIMATAMBO.png}" alt="Clínica Limatambo" style="height: 75px; width: auto; transform: scale(3.8); transform-origin: center;">
        </div>
        
        <h5 class="text-center mb-4 fw-bold">Bienvenido al Sistema</h5>

        <div th:if="${param.error}" class="alert alert-danger py-2 small text-center">
            Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.resetSuccess}" class="alert alert-success py-2 small text-center">
            Contraseña restablecida con éxito. Ya puedes ingresar.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-bold">Usuario (DNI)</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control bg-light border-0" placeholder="Ingrese su DNI" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label small fw-bold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" id="passwordInput" class="form-control bg-light border-0" placeholder="********" required>
                    <button class="btn btn-light bg-light border-0" type="button" id="togglePasswordBtn" style="color: var(--matcha-main);">
                        <i class="bi bi-eye-slash" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-reservar w-100 mb-3">INGRESAR</button>
            
            <div class="text-center">
                <a th:href="@{/forgot-password}" class="text-decoration-none small text-muted d-block mb-2">
                    ¿Olvidaste tu contraseña?
                </a>
                <a th:href="@{/registro}" class="text-decoration-none small text-success fw-bold d-block mb-3">
                    ¿No tienes cuenta? Regístrate aquí
                </a>
                <a th:href="@{/}" class="text-decoration-none small text-muted d-block">
                    <i class="bi bi-arrow-left me-1"></i> Volver al inicio
                </a>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('passwordInput');
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            const togglePasswordIcon = document.getElementById('togglePasswordIcon');

            if(togglePasswordBtn) {
                togglePasswordBtn.addEventListener('click', function () {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    
                    if (type === 'password') {
                        togglePasswordIcon.classList.remove('bi-eye');
                        togglePasswordIcon.classList.add('bi-eye-slash');
                    } else {
                        togglePasswordIcon.classList.remove('bi-eye-slash');
                        togglePasswordIcon.classList.add('bi-eye');
                    }
                });
            }
        });
    </script>
</body>
</html>
